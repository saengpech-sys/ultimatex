            const submissions = {};

            function processData() {
                // Sorting assignments by length (desc) helps the regex parser match longer names first
                // e.g., 'bmi รายบุคคล' before 'bmi', preventing incorrect splits.
                const sortedAssignmentsForRegex = [...ALL_ASSIGNMENTS].sort((a, b) => b.length - a.length);
                const delimiterRegex = new RegExp(`(${sortedAssignmentsForRegex.join('|')})`, 'g');
                const parts = rawData.split(delimiterRegex).filter(p => p && p.trim() !== '');

                for (let i = 0; i < parts.length; i += 2) {
                    if (i + 1 >= parts.length) continue;
                    
                    let studentInfo = parts[i].trim();
                    let assignment = parts[i + 1].trim();
                    
                    const nameMatch = studentInfo.match(/^(.+?)(?=\d.*ม\.6\/12)/);
                    
                    if (nameMatch && nameMatch[1]) {
                        let name = nameMatch[1].trim();
                        // Clean up prefixes like 'นาย', 'น.ส.', 'นางสาว'
                        name = name.replace(/^(นาย|น\.ส\.|นางสาว)\s*/, '').trim();
                        // FIX: Remove "รายบุคคล" from student names
                        name = name.replace(/รายบุคคล/g, '').trim();

                        if (!name) continue; // Skip if name is empty after cleaning

                        if (!submissions[name]) {
                            submissions[name] = { submitted: new Set(), name: name };
                        }
                        submissions[name].submitted.add(assignment);
                    }
                }
            }

                    <div class="bg-blue-100 p-4 rounded-lg"><p class="text-xl font-bold text-blue-800">${totalStudents}</p><p class="text-blue-600">นักเรียนทั้งหมด</p></div>
                    <div class="bg-green-100 p-4 rounded-lg"><p class="text-xl font-bold text-green-800">${completeCount}</p><p class="text-green-600">ส่งงานครบ</p></div>
                    <div class="bg-red-100 p-4 rounded-lg"><p class="text-xl font-bold text-red-800">${incompleteCount}</p><p class="text-red-600">ยังไม่ครบ</p></div>
                    <div class="bg-gray-100 p-4 rounded-lg"><p class="text-xl font-bold text-gray-800">${ALL_ASSIGNMENTS.length}</p><p class="text-gray-600">ชิ้นงานทั้งหมด</p></div>
                `;
            }

            function renderCrosstab() {
                const container = document.getElementById('crosstab-container');
                const searchInput = document.getElementById('searchInput').value.toLowerCase();
                const filterValue = document.getElementById('filterSelect').value;
                
                const sortedAssignments = [...ALL_ASSIGNMENTS].sort((a, b) => a.localeCompare(b, 'th'));

                // Build header HTML
                let headerHtml = `<th scope="col" class="sticky-col sticky-head bg-gray-100 px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider"><div class="w-40">ชื่อ-สกุล</div></th>`;
                sortedAssignments.forEach(assignment => {
                    headerHtml += `<th scope="col" class="sticky-head bg-gray-100 px-2 py-3 text-center text-xs font-bold text-gray-600 uppercase tracking-wider align-bottom" style="height: 160px;"><span class="inline-block" style="writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap;">${assignment}</span></th>`;
                });

                // Build body HTML
                let bodyHtml = '';
                const studentArray = Object.values(submissions).sort((a, b) => a.name.localeCompare(b.name, 'th'));

                studentArray.forEach(student => {
                    const { name, submitted } = student;
                    const isComplete = submitted.size === ALL_ASSIGNMENTS.length;

                    // Apply filters
                    if (!name.toLowerCase().includes(searchInput)) return;
                    if (filterValue === 'complete' && !isComplete) return;
                    if (filterValue === 'incomplete' && isComplete) return;

                    const rowBg = isComplete ? 'bg-green-50' : 'bg-white';

                    let rowHtml = `<td class="sticky-col px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900 ${rowBg}">${name}</td>`;
                    sortedAssignments.forEach(assignment => {
                        const hasSubmitted = submitted.has(assignment);
                        const cellContent = hasSubmitted 
                            ? '<span class="text-green-600 font-bold text-lg">✓</span>' 
                            : '<span class="text-red-400 text-lg font-light">·</span>';
                        rowHtml += `<td class="px-2 py-3 whitespace-nowrap text-center text-sm">${cellContent}</td>`;
                    });
                    bodyHtml += `<tr class="hover:bg-gray-50 ${rowBg}">${rowHtml}</tr>`;
                });
                
                // Final table assembly
                container.innerHTML = `<table class="min-w-full border-collapse">
                    <thead class="bg-gray-100"><tr>${headerHtml}</tr></thead>
                    <tbody class="divide-y divide-gray-200">${bodyHtml}</tbody>
                </table>`;
            }

            // --- INITIALIZATION ---
            
            processData();
            renderSummary();
            renderCrosstab();

            document.getElementById('searchInput').addEventListener('input', renderCrosstab);
            document.getElementById('filterSelect').addEventListener('change', renderCrosstab);
        });
    </script>
</body>
</html>
